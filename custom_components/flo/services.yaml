# Describes the format for available Flo services

set_sleep_mode:
  target:
    entity:
      integration: flo
      domain: switch
  fields:
    sleep_minutes:
      required: true
      default: 120
      selector:
        select:
          options:
            - "60"
            - "120"
            - "180"
            - "240"
            - "300"
            - "360"
            - "420"
            - "480"
            - "540"
            - "600"
            - "660"
            - "720"
    revert_to_mode:
      required: true
      default: "home"
      selector:
        select:
          options:
            - "away"
            - "home"
set_away_mode:
  target:
    entity:
      integration: flo
      domain: switch
set_home_mode:
  target:
    entity:
      integration: flo
      domain: switch
run_health_test:
  target:
    entity:
      integration: flo
      domain: switch
